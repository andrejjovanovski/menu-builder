services:
  postgres:
    image: postgres:16-alpine
    container_name: menucup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: menucup
      POSTGRES_USER: menucup
      POSTGRES_PASSWORD: menucup
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menucup -d menucup"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: menucup-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: menucup
      MINIO_ROOT_PASSWORD: menucup123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    container_name: menucup-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 menucup menucup123) do echo 'waiting for minio...' && sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/menucup;
      /usr/bin/mc anonymous set public local/menucup;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
